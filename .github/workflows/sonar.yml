# SonarCloud — analise estatica + cobertura de testes (backend + mobile)
#
# Requisitos no GitHub:
#   - Secret "SONAR": token de conta gerado em
#     https://sonarcloud.io/account/security/ (tipo "Global analysis token")
#   - Projeto importado no SonarCloud (sonarcloud.io) na organizacao
#     configurada em sonar-project.properties

name: SonarCloud

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarcloud:
    name: Analise estatica e cobertura
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR }}

    steps:
      # Historico completo necessario para o Sonar atribuir codigo aos autores
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            mobile/package-lock.json

      # Reaproveita scripts/install.js (raiz + backend + mobile).
      # DOMUS_SKIP_DB=1 pula a criacao do banco SQLite no runner.
      - name: Instalar dependencias
        run: npm install
        env:
          DOMUS_SKIP_DB: '1'

      # Os testes usam um SQLite isolado (test/setup-env.ts define
      # DATABASE_URL=file:./test.db). Aplica as migracoes nele antes
      # de rodar as suites, protegendo o dev.db de desenvolvimento.
      - name: Preparar banco de testes
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: 'file:./test.db'

      - name: Testes do backend (cobertura)
        run: npm run test:cov --prefix backend

      - name: Testes do mobile (cobertura)
        run: npm test --prefix mobile -- --coverage --forceExit

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR }}

      - name: Quality Gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@3cfda8eca512232cb42bd40fd01567cba471db39 # v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR }}
