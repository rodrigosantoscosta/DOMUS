# ---------------------------------------------------------------------------
# SonarCloud — DOMUS (backend NestJS + mobile Expo/React Native)
# Docs: https://docs.sonarsource.com/sonarcloud/
#
# OBS: se o seu projeto no SonarCloud tiver org/chave diferentes,
# ajuste "sonar.organization" e "sonar.projectKey" abaixo.
# ---------------------------------------------------------------------------

sonar.host.url=https://sonarcloud.io
sonar.projectKey=rodrigosantoscosta_DOMUS
sonar.projectName=DOMUS
sonar.organization=rodrigosantoscosta

# Versao do projeto lida do package.json na raiz
sonar.projectVersion=1.0.0

# Codigos analisados (fontes dos dois modulos)
sonar.sources=backend/src,mobile/src
sonar.tests=backend/src,mobile/src

# Padroes de arquivos de teste (Jest)
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Exclusoes: dependencias, builds, mocks de teste e legado
sonar.exclusions=**/node_modules/**,\
  **/__mocks__/**,\
  **/dist/**,\
  **/dist-web/**,\
  **/.expo/**,\
  **/coverage/**,\
  legacy/**,\
  backend/prisma/seed.ts

# Relatorios de cobertura gerados pelo Jest (test:cov no backend, --coverage no mobile)
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,mobile/coverage/lcov.info

sonar.sourceEncoding=UTF-8
